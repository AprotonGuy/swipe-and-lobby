<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Lobby Tactics: a roguelike deckbuilder about real EU lobby dossiers. Pick a side, play tactic cards, win the tug of war, keep your reputation.">
<meta name="theme-color" content="#2a1f27">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Lobby Tactics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Courier+Prime:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&family=Bebas+Neue&display=swap">
<style>
/* Layout: one phone column on the plum desk. Meters on top, the opponent in the middle, your hand of paper cards at the bottom. Swipe a card up into the lobbyist to play it. */
:root{
  --night:#392b35; --night-2:#423952; --rule:#5a4e6a; --slate:#444760; --wine:#713f52;
  --paper:#d1bfb0; --paper-2:#e2d4c6; --paper-ink:#392b35; --text:#eadfd4; --muted:#a9b9b4;
  --reject:#bb474f; --yes:#4a8a45; --eu-blue:#003399; --eu-yellow:#ffcc00;
  --f-display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-type:"Courier Prime","Courier New",ui-monospace,monospace;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-bebas:"Bebas Neue","Arial Narrow",sans-serif;
  --grain:url(art/tex-paper.jpg); --t-speckle:url(art/tex-speckle.jpg); --t-laid:url(art/tex-laid.jpg); --t-card:url(art/tex-card.jpg); --t-crumple:url(art/tex-crumple.jpg);
  --sh-s:drop-shadow(0 1px 0 rgba(20,10,18,.35)) drop-shadow(0 3px 3px rgba(20,10,18,.32));
  --sh-l:0 1px 0 rgba(20,10,18,.3),0 4px 4px rgba(20,10,18,.3),0 14px 22px rgba(20,10,18,.4);
  --slipbg:var(--paper-2);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--text);font-family:var(--f-body);margin:0;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
img{-webkit-user-drag:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
.app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;padding-inline:12px;box-sizing:border-box;position:relative}

/* meters (reused from the game) */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-block:20px 6px}
.stat{position:relative;padding:15px 6px 7px;background:var(--paper-2) var(--t-laid) center/260px auto;background-blend-mode:multiply;filter:var(--sh-s)}
.stat:nth-child(odd){transform:rotate(-1.2deg)}.stat:nth-child(even){transform:rotate(1deg)}
.stat .lbl{position:absolute;top:-11px;left:50%;transform:translateX(-50%) rotate(-1.5deg);background:#ece2d6 var(--t-laid) center/260px auto;background-blend-mode:multiply;
  color:var(--paper-ink);font:700 9.5px/1 var(--f-type);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px 3px;white-space:nowrap;filter:var(--sh-s)}
.stat .ico{display:block;width:28px;height:22px;margin:2px auto 6px;color:var(--paper-ink);transition:color .15s,transform .2s cubic-bezier(.3,1.5,.5,1)}
.stat .ico svg{width:100%;height:100%;display:block;fill:currentColor}
.bar{height:7px;border-radius:1px;background:#c3b2a3;box-shadow:inset 0 1px 2px rgba(57,43,53,.4);overflow:hidden}
.bar i{display:block;height:100%;background:var(--bar);transition:width .45s cubic-bezier(.2,.8,.2,1)}
#st-trust{--bar:#2f6fd0}#st-clim{--bar:#3f8f4f}#st-eco{--bar:#e2b322}#st-corp{--bar:#e07a2a}
.stat.danger .bar i{background:var(--reject)}.stat.danger .ico,.stat.danger .lbl{color:var(--reject)}
.stat.up .ico{color:#2f8a4a;transform:translateY(-5px) scale(1.1)}.stat.down .ico{color:var(--reject);transform:translateY(5px) scale(.92)}

.hud{display:flex;justify-content:space-between;align-items:center;font:500 12px/1.2 var(--f-mono);color:var(--muted);padding:4px 2px}
.hud b{color:var(--paper-2);font-weight:700}

/* main stage */
.stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.fightwrap{flex:1;min-height:0;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:6px 0 14px}

/* opponent */
.opp{position:relative;margin:6px auto 0;width:min(340px,100%);background:var(--paper) var(--t-speckle) center/cover;background-blend-mode:multiply;color:var(--paper-ink);
  padding:12px 14px 12px;box-shadow:var(--sh-l);box-sizing:border-box;transition:transform .2s}
.opp.target{transform:scale(1.03);box-shadow:var(--sh-l),0 0 0 3px var(--eu-yellow)}
.opp.hit{animation:hit .35s}
@keyframes hit{20%{transform:translateX(-6px) rotate(-1deg)}50%{transform:translateX(5px)}80%{transform:translateX(-2px)}}
.opp-top{display:grid;grid-template-columns:86px 1fr;gap:12px;align-items:center}
.face{position:relative;width:86px;aspect-ratio:1}
.face img,.face .sil{width:100%;height:100%;border-radius:50%;object-fit:cover;display:grid;place-items:center;box-shadow:0 0 0 4px #e2d4c6,0 3px 5px 4px rgba(20,10,18,.25)}
.face .sil{font-size:40px;background:var(--sc,#9c8f84)}
.face .pclip{position:absolute;top:-10px;left:16%;width:15px;height:32px;transform:rotate(-14deg);background:linear-gradient(100deg,#1d4fa8,#3f7fe0 45%,#1d4fa8);
  -webkit-mask:url(art/ico-clip.png) center/contain no-repeat;mask:url(art/ico-clip.png) center/contain no-repeat;filter:drop-shadow(0 2px 1px rgba(20,10,18,.45))}
.opp .kick{font:700 10px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--slate)}
.opp h2{margin:2px 0 1px;font:800 19px/1.1 var(--f-display)}
.opp .role{font:400 12px/1.3 var(--f-body);color:var(--slate)}
.weak{display:inline-flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.weak span{font:700 10px/1 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding:4px 6px;border-radius:2px;color:#fff;background:var(--tc)}
.law{margin:10px 0 6px;font:800 15px/1.2 var(--f-display)}
.law small{display:block;font:500 10px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--slate);margin-bottom:2px}
.hp{position:relative;height:16px;background:#c3b2a3;box-shadow:inset 0 1px 2px rgba(57,43,53,.4)}
.hp i{position:absolute;inset:0 auto 0 0;background:var(--reject);transition:width .35s}
.hp b{position:absolute;inset:0;display:grid;place-items:center;font:700 11px/1 var(--f-mono);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.6)}
.intent{display:flex;gap:10px;align-items:center;margin-top:9px;padding:8px 10px;background:rgba(255,255,255,.35);border-left:4px solid var(--reject)}
.intent .ii{width:30px;height:30px;flex:none;background:var(--paper-ink);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.intent .ie{font-size:24px;line-height:1;flex:none}
.intent b{display:block;font:700 13px/1.2 var(--f-body)}.intent span{font:500 12px/1.3 var(--f-body);color:var(--slate)}
.intent small{display:block;font:700 9.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--reject);margin-bottom:3px}
.dmgpop{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font:400 46px/1 var(--f-bebas);color:var(--yes);pointer-events:none;animation:pop .9s ease-out forwards;text-shadow:0 2px 0 #fff}
.dmgpop.weakhit{color:#b8860b;font-size:52px}
.dmgpop small{display:block;font:400 22px/1 var(--f-bebas);letter-spacing:.06em;text-align:center}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}

/* you */
.me{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px auto 0;width:min(340px,100%);font:700 13px/1 var(--f-mono)}
.energy{display:flex;gap:5px;align-items:center}
.energy i{width:22px;height:22px;border-radius:50%;background:var(--eu-yellow);box-shadow:0 0 0 2px #2a1f28,0 2px 3px rgba(0,0,0,.4)}
.energy i.used{background:#5a4e6a}
.energy span{margin-left:4px;color:var(--muted)}
.chips{display:flex;gap:6px}
.chip{display:inline-flex;gap:4px;align-items:center;padding:5px 8px;background:#2a1f28;border:1px solid var(--rule);border-radius:999px;color:var(--paper-2)}
.chip.block{color:#9cc6e0}.chip.scan{color:#f0a0a6}

/* hand */
.handbar{padding:6px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.hand .card{margin:0}.hand .card+.card{margin-left:calc(2 * var(--ov,-12px))}
.hand{display:flex;justify-content:center;align-items:flex-end;height:186px;position:relative}
.card{position:relative;flex:none;width:108px;height:160px;margin:0 var(--ov,-12px);box-sizing:border-box;padding:8px 8px 7px;color:var(--paper-ink);cursor:grab;touch-action:none;
  background:var(--paper-2) var(--t-laid) center/220px auto;background-blend-mode:multiply;box-shadow:0 2px 3px rgba(20,10,18,.35),0 8px 14px rgba(20,10,18,.35);
  transform:translateY(var(--ty,0)) rotate(var(--rot,0deg));transition:transform .18s,opacity .2s;display:flex;flex-direction:column;gap:4px;border-top:6px solid var(--tc)}
.card:hover,.card:focus-visible{z-index:5;--ty:-14px;outline:none}
.card.dragging{transition:none;z-index:10;cursor:grabbing}
.card.cant{filter:grayscale(.7) brightness(.9)}
.card .cost{position:absolute;top:-14px;left:-6px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--eu-yellow);color:#1d1a20;font:400 20px/1 var(--f-bebas);box-shadow:0 0 0 2px #2a1f28}
.card .nm{font:800 13px/1.08 var(--f-display);margin-top:6px;min-height:28px}
.card .tg{align-self:flex-start;font:700 8.5px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--tc);padding:3px 5px;border-radius:2px}
.card .ci{height:34px;display:grid;place-items:center}
.card .ci i{display:block;width:30px;height:30px;background:var(--paper-ink);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.card .ci em{font-style:normal;font-size:26px;line-height:1}
.card .tx{font:500 10.5px/1.25 var(--f-body);flex:1}
.card .weakmark{position:absolute;right:-6px;top:-10px;font:700 9px/1 var(--f-mono);background:#b8860b;color:#fff;padding:4px 5px;border-radius:2px;transform:rotate(6deg);box-shadow:0 2px 3px rgba(0,0,0,.4)}
.handfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;font:500 11px/1.2 var(--f-mono);color:var(--muted)}
.endturn{appearance:none;border:0;cursor:pointer;padding:12px 16px;font:400 18px/1 var(--f-bebas);letter-spacing:.06em;color:#f3e8de;background:var(--reject) var(--t-card) center/220px auto;background-blend-mode:multiply;
  clip-path:polygon(0 6%,100% 0,98.5% 100%,1.5% 94%);filter:var(--sh-s)}
.endturn:focus-visible{outline:3px solid var(--eu-yellow);outline-offset:3px}

/* paper panels and buttons */
.panel{width:min(360px,100%);margin:10px auto;box-sizing:border-box;background:var(--paper-2) var(--grain) center/cover;background-blend-mode:multiply;color:var(--paper-ink);padding:16px;box-shadow:var(--sh-l)}
.panel .kick{font:700 10.5px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--wine)}
.panel h2{margin:4px 0 6px;font:800 24px/1.08 var(--f-display);text-wrap:balance}
.panel p{margin:6px 0;font:400 14.5px/1.45 var(--f-body)}
.btn{display:block;width:100%;appearance:none;border:0;cursor:pointer;padding:14px 12px;margin-top:10px;font:700 15px/1 var(--f-body);color:#f3e8de;
  background:var(--paper-ink) var(--t-card) center/240px auto;background-blend-mode:multiply;clip-path:polygon(0 4%,100% 0,99.5% 96%,.5% 100%);filter:var(--sh-s)}
.btn.green{background-color:var(--yes)}.btn.red{background-color:var(--reject)}.btn.light{background-color:var(--paper);color:var(--paper-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--eu-yellow);outline-offset:3px}
.logo{display:grid;justify-items:center;gap:6px;position:relative;margin:24px 0 8px;color:var(--paper-ink)}
.logo .lg{display:block;background:var(--paper-2) var(--t-laid) center/260px auto;background-blend-mode:multiply;font:800 clamp(40px,12vw,54px)/1 var(--f-display);padding:8px 18px 10px;filter:var(--sh-s)}
.logo .lg.red{background-color:#c8453a;color:#fff6ea}.logo .s1{transform:rotate(-3deg) translateX(-16px)}.logo .s2{transform:rotate(2deg) translateX(18px)}
.logo .amp{position:absolute;left:calc(50% + 90px);top:42%;transform:translate(-50%,-50%) rotate(-8deg);width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  background:var(--reject);color:#f3e8de;font:800 30px/1 var(--f-display);filter:var(--sh-s)}
.sub{text-align:center;font:400 22px/1 var(--f-bebas);letter-spacing:.08em;color:var(--eu-yellow);margin-bottom:6px}

/* map / choice tiles */
.route{display:flex;justify-content:center;gap:6px;margin:8px 0 2px}
.route i{width:30px;height:8px;background:#5a4e6a}.route i.done{background:var(--yes)}.route i.now{background:var(--eu-yellow)}.route i.boss{width:44px}
.choice{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;width:100%;text-align:left;appearance:none;cursor:pointer;margin-top:10px;padding:10px;
  background:rgba(255,255,255,.3);border:3px solid var(--paper-ink);border-radius:10px;color:var(--paper-ink)}
.choice:hover{background:rgba(255,255,255,.55)}.choice:focus-visible{outline:3px solid var(--eu-yellow)}
.choice .face{width:64px}
.choice b{display:block;font:800 16px/1.15 var(--f-display)}.choice small{display:block;font:400 12.5px/1.3 var(--f-body);color:var(--slate)}
.choice .weak span{font-size:9px}
.side{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.side button{appearance:none;cursor:pointer;padding:12px 8px;border:4px solid var(--c);border-radius:12px;background:rgba(255,255,255,.3);color:var(--paper-ink);display:grid;gap:5px;justify-items:center;text-align:center}
.side button b{font:400 22px/1 var(--f-bebas);letter-spacing:.04em}
.side button small{font:500 11.5px/1.3 var(--f-body);color:var(--slate)}
.fxl{display:flex;flex-wrap:wrap;gap:4px 8px;justify-content:center;font:600 12px/1 var(--f-mono)}
.fxl .p{color:#2f7a35}.fxl .n{color:var(--reject)}

/* reward cards */
.cardrow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px 0}
.cardrow .card{margin:0;cursor:pointer}
.cardrow .card.sel{box-shadow:0 0 0 3px var(--yes),0 8px 14px rgba(20,10,18,.35)}
.price{display:block;text-align:center;font:700 12px/1 var(--f-mono);margin-top:6px}
.shopitem{display:grid;justify-items:center}
.art{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px dashed rgba(57,43,53,.3)}
.art .ae{font-size:28px;text-align:center}
.art b{display:block;font:700 14px/1.2 var(--f-body)}.art small{font:400 12.5px/1.3 var(--f-body);color:var(--slate)}
.art button{appearance:none;border:0;cursor:pointer;padding:9px 10px;background:var(--paper-ink);color:var(--paper-2);font:600 12.5px/1 var(--f-body)}
.art button:disabled{opacity:.4}
.rc{background:var(--eu-blue);color:#eef1fb;padding:10px 12px;margin:10px 0;font:600 13.5px/1.4 var(--f-body)}
.rc b{color:var(--eu-yellow)}
.more summary{cursor:pointer;font:700 12px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--eu-blue);margin:6px 0}
.more h4{margin:8px 0 2px;font:700 10.5px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--reject)}
.more p{font-size:13.5px!important}
.more a{color:var(--eu-blue)}

/* overlays: card detail, Gerard */
.veil{position:fixed;inset:0;z-index:30;background:rgba(28,20,26,.7);display:grid;place-items:center;padding:16px}
.detail{display:grid;justify-items:center;gap:12px}
.detail .card{transform:scale(1.55);margin:60px 0 40px;cursor:default}
.detail .row{display:flex;gap:10px;width:min(300px,90vw)}
.detail .row .btn{margin:0}
.gerard{display:flex;gap:12px;align-items:flex-start;width:min(380px,100%);box-sizing:border-box;background:var(--paper-2) var(--grain) center/cover;background-blend-mode:multiply;color:var(--paper-ink);padding:14px;box-shadow:var(--sh-l)}
.gerard svg{width:54px;height:54px;flex:none;border-radius:50%;background:rgba(57,43,53,.06)}
.gerard .gl{display:block;font:700 10px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--slate);margin-bottom:3px}
.gerard p{margin:0 0 6px;font:500 14px/1.45 var(--f-body)}
.gerard p b{font-weight:700}
.gerard p+p{margin-top:8px}
.gerard .btn{margin-top:6px;padding:10px}
.glow{position:fixed;top:0;bottom:0;width:100%;left:0;pointer-events:none;z-index:2;opacity:0;transition:opacity .2s;background:radial-gradient(70% 40% at 50% 30%,rgba(255,204,0,.25),transparent 70%)}
.banner{position:fixed;left:0;right:0;top:42%;z-index:35;text-align:center;font:400 44px/1 var(--f-bebas);letter-spacing:.08em;color:#fff;background:var(--reject);padding:12px 0 8px;
  animation:ban .65s ease-out forwards;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.4)}
@keyframes ban{0%{transform:scaleY(0)}20%{transform:scaleY(1)}80%{opacity:1}100%{opacity:0}}
.opp.lunge{animation:lunge .5s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes lunge{0%{transform:none}40%{transform:translateY(22px) scale(1.06) rotate(-1deg)}100%{transform:translateY(8px) scale(1.02)}}
.say{position:absolute;left:12px;right:12px;bottom:-30px;z-index:6;background:#fff;color:var(--paper-ink);border:2px solid var(--paper-ink);border-radius:12px;padding:9px 12px;
  font:italic 600 14px/1.35 var(--f-body);text-align:center;box-shadow:0 6px 14px rgba(0,0,0,.35);animation:say .3s cubic-bezier(.3,1.5,.5,1)}
.say::before{content:"";position:absolute;top:-10px;left:50%;margin-left:-9px;border:9px solid transparent;border-top:0;border-bottom:10px solid var(--paper-ink)}
@keyframes say{from{opacity:0;transform:scale(.6)}}
.float{position:fixed;z-index:45;transform:translate(-50%,-50%);pointer-events:none;font:400 30px/1 var(--f-bebas);letter-spacing:.03em;white-space:nowrap;
  color:#fff;padding:5px 10px;border-radius:4px;box-shadow:0 4px 10px rgba(0,0,0,.4);animation:flt 1.3s ease-out forwards}
.float.bad{background:var(--reject)}.float.good{background:var(--yes)}.float.blockf{background:#2f6fd0;font-size:24px}
@keyframes flt{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}
.stat.shake{animation:mshake .5s}
@keyframes mshake{15%{translate:-5px 0}35%{translate:5px 0}55%{translate:-3px 0}75%{translate:2px 0}}
.hp.heal i{background:#c98a2e}
.hand.away .card{transform:translateY(240px)!important;opacity:0}
.endturn:disabled{opacity:.5}

.pname{display:grid;gap:5px;margin:12px 0 4px;font:700 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--wine)}
.pname input{font:italic 500 20px/1.2 var(--f-body);color:var(--paper-ink);background:transparent;border:0;border-bottom:2px solid var(--paper-ink);padding:4px 2px;outline:none;text-transform:none;letter-spacing:0}
.pname input:focus{border-bottom-color:var(--yes)}
.panel.wide{width:min(720px,100%)}
.classes{display:grid;gap:10px;margin-top:8px}
.cls{appearance:none;cursor:pointer;display:grid;grid-template-columns:48px 1fr;column-gap:12px;row-gap:3px;text-align:left;padding:10px 12px;border:4px solid var(--c);border-radius:12px;background:rgba(255,255,255,.3);color:var(--paper-ink)}
.cls:hover{background:rgba(255,255,255,.55)}.cls:focus-visible{outline:3px solid var(--eu-yellow)}
.cls .ce{grid-row:1/5;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--c);box-shadow:0 0 0 3px #e2d4c6}

/* ---------- the map of Brussels ---------- */
const ROWS=7,COLS=4;
const NODE={dossier:{e:'📁',n:'Dossier'},elite:{e:'💀',n:'Heavy lobbyist'},shop:{e:'💶',n:'The back room'},rest:{e:'☕',n:'Break with Gerard'},unknown:{e:'❓',n:'Unknown'},boss:{e:'🏛️',n:'Final vote'}};
function genMap(){const nodes={},edges=new Set(),pool=shuffle(POOL);let pi=0;
  const key=(r,c)=>r+':'+c;
  const starts=shuffle([0,1,2,3]).slice(0,3);starts.push(rnd([0,1,2,3]));
  starts.forEach(c0=>{let c=c0;for(let r=0;r<ROWS;r++){nodes[key(r,c)]=nodes[key(r,c)]||{r,c};
      if(r<ROWS-1){const nc=Math.max(0,Math.min(COLS-1,c+rnd([-1,0,1])));edges.add(key(r,c)+'>'+key(r+1,nc));c=nc;}
      else edges.add(key(r,c)+'>boss');}});
  nodes.boss={r:ROWS,c:1.5,type:'boss',id:BOSS};
  Object.values(nodes).forEach(n=>{if(n.type)return;
    let t='dossier';const x=Math.random();
    if(n.r===0)t='dossier';else if(n.r===ROWS-1)t='rest';else if(n.r===3)t=x<.45?'shop':x<.7?'unknown':'dossier';
    else if(n.r>=2&&x<.18)t='elite';else if(x<.32)t='unknown';else if(x<.4)t='rest';
    n.type=t;if(t==='dossier'||t==='elite'){n.id=pool[pi++%pool.length];}});
  // Every map: at least 2 back rooms (on different rows) and at least 3 ❓ events. Turn plain dossiers into them, never on the first or last row.
  const all=Object.values(nodes).filter(n=>n.r>0&&n.r<ROWS-1),cnt=t=>all.filter(n=>n.type===t).length;
  const conv=(t,pick)=>{const c=shuffle(all.filter(n=>n.type==='dossier'&&pick(n)));if(!c.length)return false;const n=c[0];n.type=t;delete n.id;return true;};
  while(cnt('shop')<2){const rows=all.filter(n=>n.type==='shop').map(n=>n.r);if(!conv('shop',n=>!rows.includes(n.r)&&n.r>=2)&&!conv('shop',n=>!rows.includes(n.r))&&!conv('shop',()=>true))break;}
  while(cnt('unknown')<3){if(!conv('unknown',()=>true))break;}
  return {nodes,edges:[...edges],at:null,done:[]};}
function nextNodes(){const M=R.map;if(!M.at)return Object.keys(M.nodes).filter(k=>M.nodes[k].r===0);return M.edges.filter(e=>e.startsWith(M.at+'>')).map(e=>e.split('>')[1]);}
function mapScreen(){setMusic('map');document.body.classList.remove('ontitle');updStats();if(!R.map)R.map=genMap();const M=R.map,can=new Set(nextNodes());
  const RH=matchMedia('(orientation:portrait)').matches?124:88,X=c=>13+c*24.6,Y=r=>(ROWS-r)*RH+50,H=(ROWS+1)*RH+50;
  const lines=M.edges.map(e=>{const [a,b]=e.split('>'),A=M.nodes[a],B=M.nodes[b];const walked=M.done.includes(a)&&(M.done.includes(b)||M.at===b);
    return `<line x1="${X(A.c)}%" y1="${Y(A.r)}" x2="${X(B.c)}%" y2="${Y(B.r)}" class="${walked?'walked':''}"/>`;}).join('');
  const nodes=Object.entries(M.nodes).map(([k,n])=>{const T=NODE[n.type],c=n.id?card(n.id):null,m=c?mission(c):null;
    const cls=[n.type,can.has(k)?'can':'',M.done.includes(k)?'done':'',M.at===k?'here':'',m?'m'+m:''].join(' ');
    return `<button class="node ${cls}" data-k="${k}" style="left:${X(n.c)}%;top:${Y(n.r)}px" ${can.has(k)?'':'tabindex="-1"'} aria-label="${T.n}${c?': '+esc(c.title):''}">
      <span class="ni">${n.type==='boss'?faceHTML(card(BOSS).name,'TECH'):n.type==='dossier'&&c?(SECTORS[c.sector]||{}).g||T.e:T.e}</span>${m?`<span class="mm">${m==='R'?'✅':'⛔'}</span>`:''}${c&&n.type!=='boss'?`<span class="nl">${esc(c.title)}</span>`:''}</button>`;}).join('');
  stage().innerHTML=`<div class="screen mapscreen"><div class="mapwrap"><div class="map" style="height:${H}px"><svg class="mapl" width="100%" height="${H}">${lines}</svg>${nodes}</div>
    <div class="legend"><b>Legend</b><span>✅ Your style: push</span><span>⛔ Your style: block</span><span>💀 Heavy lobbyist</span><span>💶 The back room</span><span>☕ Break with Gerard</span><span>❓ Unknown</span><span>🏛️ Final vote</span></div></div><button class="legbtn" id="legbtn">ⓘ Legend</button></div>`;
  $('#legbtn').onclick=()=>{$('#ovl').innerHTML=`<div class="veil"><div class="panel legpop"><div class="kick">How to read the map</div><h2>Legend</h2>

    <ul><li>✅ Your style: push it through</li><li>⛔ Your style: block it</li><li>💀 Heavy lobbyist</li><li>💶 The back room</li><li>☕ Break with Gerard</li><li>❓ Unknown</li><li>🏛️ Final vote</li></ul>
    <button class="btn" id="legx">Got it</button></div></div>`;$('#legx').onclick=()=>$('#ovl').innerHTML='';};

  const here=stage().querySelector('.node.can');if(here){here.scrollIntoView({block:'center'});}}
function enterNode(k){const M=R.map,n=M.nodes[k];M.at=k;M.done.push(k);

// +1: you pull the topic up to 100, -1: down to 0. Blocking a business ask protects the public interest; pushing it through gives it away.

// You choose the side. Your commissioner's style side pays their signature reward; the other side pays something else you may need more.
const SIDE_REWARD={hawk:{style:{budget:30,tx:'+€30k lobby budget'},other:{rep:12,tx:'Reputation +12: “Even the Hawk said no.”'}},

const PUSH_FOES={
 union:{name:'Rosa Strikewell',role:'Shop steward · European trade union',sector:'UNION',ico:'👷',bloc:'CIT',weak:['money'],intents:'UNION'},

const FOE_BY_TOPIC={workers:'union',economy:'union',consumers:'consumer',nature:'green',health:'green',privacy:'rights',democracy:'rights'};
function foeOf(c,side){const b=blocOf(c);

    return '<small class="where">'+[h&&`${h} in hand`,d&&`${d} in pile`,x&&`${x} discarded`,u>0&&`${u} used`].filter(Boolean).join(' · ')+'</small>';};

/* ---------- the fight ---------- */
function fight(id,side,boss,elite){const c=card(id),b=blocOf(c);
  let o=foeOf(c,side);
  if(boss){const A=card(BOSS);o={name:A.name,role:A.role+' · '+A.org,sector:A.sector,bloc:'TECH',weak:['transparency','privacy'],intents:BOSS_INTENTS};}
  if(R.heat>=6)o.intents=[...o.intents,SCANDAL];
  const first=R.fights===0&&!boss;if(first){const plain=o.intents.filter(i=>!i.skip&&!i.hide&&!i.rep&&!i.fake&&!i.fakenews&&!i.curse);if(plain.length)o.intents=plain;}
  const P=effPower(),B=Math.round(boss?P*TUNE.ropeB:P*(TUNE.rope+TUNE.ropeS*R.fights)*(elite?1.15:1)*(R.fights===0?.7:1));
  F={c,side,boss,elite,o,B,bar:0,dir:dirOf(c,side),topic:topicOf(c),over:false,draw:shuffle(R.deck),hand:[],disc:[],energy:3,block:(has('skin')?6:0)+(has('golf')?10:0)+((CLASSES[R.cls]||{}).block||0),turn:0,freeMedia:has('whistle'),glasses:has('glasses'),next:null};
  updJail();
  {const raw=o.intents.map(t=>(t.fx?t.fx.reduce((a,v)=>a+Math.abs(v),0):0)||t.heal||0).filter(x=>x>0),avg=raw.length?raw.reduce((a,b)=>a+b,0)/raw.length:7;
   const f=boss?TUNE.fb:Math.min(TUNE.fmax,TUNE.f0+TUNE.fs*R.fights)*(elite?1.15:1);F.M=TUNE.k*effPower()*f/avg*((CLASSES[R.cls]||{}).press||1);}
  F.mercy=(R.lossStreak||0)>=2?.9:1;
  setMusic('battle');F.pushMul=R.nextPush||1;R.nextPush=0;if(R.headStart&&!boss){F.bar=Math.round(F.B*R.headStart);}R.headStart=0;
  if(has('cloud')){F.draw.push('dinner');F.draw=shuffle(F.draw);}
  if(boss&&has('door'))F.bar=-Math.round(F.B*.2);
  startTurn(true);
  if(has('rolex')){R.rep-=3;updStats();setTimeout(()=>floatAt($('#st-rep'),'⌚ 🎖️ −3','bad'),300);if(dead())return gameOver();}
  if(!R.seenTip){R.seenTip=true;gerard('Ah, your first fight. Swipe a card <b>up into the lobbyist</b> to play it, or tap it to read it first. Yellow dots are your energy. See their <b>next move</b>? That’s how hard they will pull back. Block it, or out-pull them. Hit their <b>weakness</b> for double pull.');}}
function drawN(n){for(let i=0;i<n;i++){if(!F.draw.length){if(!F.disc.length)return;F.draw=shuffle(F.disc);F.disc=[];}const d=F.draw.pop();F.hand.push(d);if(d==='oath'&&R){R.rep-=2;updStats();setTimeout(()=>floatAt($('#st-rep'),'🩸 🎖️ −2','bad'),200);}}}
function pickIntent(){const ok=t=>!(t.skip&&(F.turn<=1||F.skipped));let t=F.o.intents[F.turn%F.o.intents.length];if(F.turn>0&&Math.random()<.35)t=rnd(F.o.intents);if(!ok(t))t=F.o.intents.find(ok);F.next=t;}
function startTurn(first){F.turn++;if(F.tut){F.energy=3;F.block=0;F.hand=TUT_HANDS[Math.min(2,F.turn-1)].slice();F.hid=F.hand.map(()=>false);F.next=TUT_INT[Math.min(2,F.turn-1)];renderFight();setTimeout(()=>gerard(TUT_TIPS[Math.min(2,F.turn-1)]),200);return;}F.energy=3+(first&&has('espresso')?1:0)+(has('rolex')?1:0);if(!first)F.block=0;drawN(((CLASSES[R.cls]||{}).draw||5)+(first&&has('intern')?1:0)+(has('cloud')?1:0));F.hid=F.hand.map(()=>false);if(F.fnNext){F.fn=F.fnNext;F.fnNext=0;}
  if(F.hideNext){shuffle(F.hand.map((_,i)=>i)).slice(0,F.hideNext).forEach(i=>F.hid[i]=true);F.hideNext=0;}
  pickIntent();renderFight();if(F.skipNext){F.skipNext=false;skipTurn();}}
// A.R.T.H.U.R.'s generated card: a copy of one of yours with a tiny typo. Playing it pulls 5 their way.
function makeFake(){const pool=R.deck.filter(id=>CARDS_T[id].tag!=='curse'&&!CARDS_T[id].fake),src=rnd(pool),t=CARDS_T[src],id='fake_'+src;
  if(!CARDS_T[id]){let n=t.n;n=/l/.test(n)?n.replace('l','I'):/o/.test(n)?n.replace('o','0'):/e/.test(n)?n.replace('e','é'):n+'.';CARDS_T[id]={...t,n,fake:1,exhaust:1};}return id;}
function checkV2(){if(F.boss&&!F.v2&&!F.over&&F.bar>=F.B*.5){F.v2=true;const o=$('#opp');if(o){o.classList.add('v2');o.insertAdjacentHTML('beforeend','<div class="say">Update complete. Now with 20% more lobbying.</div>');}floatAt($('#tug'),'⚙️ A.R.T.H.U.R. 2.0','bad');}}

function intro(then){setMusic('ghost');if(window.FAST||LS.get('lt_intro')==='1')return then();LS.set('lt_intro','1');const ret=runsPlayed()>=1&&tutDone(),g=(typeof CHARS!=='undefined'&&CHARS.ghost&&CHARS.ghost.svg)||'';

    ['Suddenly: a cold breeze. The lamp flickers. A shiver runs down your spine.','cold'],['Someone… or something… clears its throat.','ghost']];
  const el=document.createElement('div');el.id='intro';el.innerHTML=`<div class="office"><div class="win"><i></i></div><div class="lamp"><b></b></div><div class="desk"></div><div class="papers"><i></i><i></i><i></i></div><div class="ig">${g}</div></div>
    <p class="itx"></p><button class="iskip">Skip ›</button>`;document.body.appendChild(el);
  let k=0,ch=0,tm=null,done=false;const tx=el.querySelector('.itx'),of=el.querySelector('.office');

  const line=()=>{if(k>=L.length)return finish();const [t,c]=L[k];if(c)of.classList.add(c);ch=0;tx.textContent='';clearInterval(tm);
    tm=setInterval(()=>{ch++;tx.textContent=t.slice(0,ch);if(ch>=t.length){clearInterval(tm);tm=setTimeout(next,1400);}},32);};

  line();}
// ---- Tutorial: a short, scripted tug of war against Gerard. Fixed hands, small pulls, can't lose, no reputation at stake.
const TUT_HANDS=[['presser','presser','presser'],['factsheet','presser','presser'],['hearing','hearing','hearing']];
const TUT_INT=[{n:'Rattles his business cards',em:'📇',fx:[0,0,0,4]},{n:'Spooky lobby lunch',icon:'lunch',fx:[0,0,0,6]},{n:'Boo!',em:'👻',fx:[0,0,0,3]}];

  F={c,side:'L',boss:false,elite:false,tut:true,again,o:{name:'Gerard Loby',role:'Ghost of the 13th floor · Berlaymont',sector:'NGO',bloc:'GREEN',weak:['law'],intents:TUT_INT,ico:'👻'},
    B:40,bar:0,dir:1,topic:'democracy',over:false,draw:[],hand:[],disc:[],energy:3,block:0,turn:0,next:null};

// They made you lose a turn: show it, then their move happens straight away.
async function skipTurn(){busy=true;const h=$('#hand');if(h)h.classList.add('away');
  document.body.insertAdjacentHTML('beforeend','<div class="banner" id="banner">You lose your turn!</div>');await sleep(1300);$('#banner')&&$('#banner').remove();busy=false;endTurn();}
// Media attention 9+: one random card is "in jail" (evidence seized) until attention drops below 9.
function updJail(){if(!R)return;if(R.heat>=9){if(!R.jail||!R.deck.includes(R.jail)){const pool=R.deck.filter(id=>CARDS_T[id].tag!=='curse');R.jail=pool.length?rnd(pool):null;if(R.jail)toast('🔒 '+CARDS_T[R.jail].n+' is in jail');}}else R.jail=null;}
const isJailed=i=>!!(R&&R.jail&&F&&F.hand[i]===R.jail&&F.hand.indexOf(R.jail)===i);
function costOf(id){const t=CARDS_T[id];if(F&&F.freeNext&&!t.nextFree&&t.tag!=='curse')return 0;return (t.tag==='media'&&F.freeMedia)?0:t.cost+(t.tag==='dirty'&&R.heat>=3?1:0);}
// Arrows follow the rope: yours point to your winning end, theirs to the other end.
const YA=()=>F&&F.dir<0?'◀':'▶',TA=()=>F&&F.dir<0?'▶':'◀';
function pullInfo(){const t=F.next,base=(t.fx?t.fx.reduce((a,v)=>a+Math.abs(v),0):0)||t.heal||0,row=(a,b)=>`<li><span>${a}</span><b>${b}</b></li>`,pc=x=>(x>=1?'+':'−')+Math.round(Math.abs(x-1)*100)+'%';
  const L=[row('Base move: '+esc(t.n),base),row('Scaled to your deck and this dossier','×'+(F.M||1).toFixed(2))];

  const rw=F.reward;if(rw){if(rw.budget)R.budget+=rw.budget;if(rw.rep)R.rep=Math.min(100,R.rep+rw.rep);if(rw.card)R.deck.push(rw.card);updStats();}
  const T=TOPICS[F.topic];
  stage().innerHTML=`<div class="screen"><div class="panel"><div class="kick">You won the tug of war · +€${gain}k lobby budget${has('rolodex')?' · 📇 +€10k':''}</div>${rw?`<div class="rwbox">🎁 ${rw.tx}</div>`:''}<h2>${esc(c.title)}</h2>
   <p class="goal">${T.e} ${T.n} ${F.dir>0?'pulled up to 100':'pulled down to 0'}.</p>${rcHTML(c,side,true)}
   <button class="btn green" id="next">${F.boss?'End of term':'Choose a new tactic'}</button></div></div>`;
  $('#next').onclick=F.boss?endRun:(rw&&rw.upgrade?()=>sharpen(reward,reward):reward);
  if(rw&&rw.rep<0&&dead())return gameOver();
  if(F.elite){const a=Object.keys(ARTIFACTS).filter(x=>!has(x)&&!ARTIFACTS[x].bad);if(a.length)gainArt(rnd(a));}}
function tutorialWon(){LS.set('lt_tut','1');const again=F.again;F=null;R=null;newRun();renderStats();
  $('#ovl').innerHTML=`<div class="veil">${scene('ghost','Gerard Loby','Practice over',`<p>Not bad for a living person. That’s the whole game: pull the rope to your side, block what they pull, hit their weakness.</p><p>Now go. The real ones don’t go easy.</p><button class="btn" id="tdone">${again?'Back to the menu':'Choose your Commissioner →'}</button>`)}</div>`;
  $('#tdone').onclick=()=>{$('#ovl').innerHTML='';again?title():pickClass('Commissioner',true);};}
function loseFight(){SFX.lose();setMusic(null);const c=F.c,side=F.side,loss=F.boss?50:30;R.used.push(c.id);R.fights++;R.log.push({c,side,won:false});R.lossStreak=(R.lossStreak||0)+1;R.rep-=loss;updStats();
  if(dead()||F.boss)return gameOver(F.boss&&!dead()?'vote':'');
  stage().innerHTML=`<div class="screen"><div class="panel" style="border-top:6px solid var(--reject)"><div class="kick">You lost the tug of war · 🎖️ reputation −${loss}</div><h2>${esc(c.title)}</h2>
   <p>${esc(F.o.name)} pulled it their way. The papers are not kind.</p>${rcHTML(c,side,false)}
   <button class="btn" id="next">Back to the map</button></div></div>`;$('#next').onclick=mapScreen;}
// A compromise held: +5 reputation, budget by where the zone was, and a card choice with a chance at a rare deal card.
function compromiseWin(){SFX.win();setMusic(null);const c=F.c,side=F.side,pos=F.neg.c/F.B,share=pos>.1?1:pos>=-.1?.75:.5;
  R.used.push(c.id);R.fights++;R.log.push({c,side,won:true,comp:true});R.lossStreak=0;R.rep=Math.min(100,R.rep+5);
  const gain=Math.round((20+(F.elite?15:0))*((CLASSES[R.cls]||{}).budget||1)*share);R.budget+=gain;updStats();
  stage().innerHTML=`<div class="screen"><div class="panel" style="border-top:6px solid var(--eu-blue,#2f4f9a)"><div class="kick">🤝 Compromise reached · 🎖️ +5 · +€${gain}k</div><h2>${esc(c.title)}</h2>
   <p class="goal">“A true statesman.” You held the middle for two rounds. ${share===1?'And the deal leans your way.':share<1&&share>.5?'Right down the middle.':'It leans their way, but it is a deal.'}</p>${rcHTML(c,side,'comp')}
   <button class="btn green" id="next">Choose a new tactic</button></div></div>`;
  $('#next').onclick=()=>reward(shuffle([...shuffle(REWARD_POOL).slice(0,2),rnd(DEAL_CARDS)]));}
function reward(pre){const opts=Array.isArray(pre)?pre:shuffle(REWARD_POOL).slice(0,3);let sel=-1;
  const draw=()=>{stage().innerHTML=`<div class="screen">${route()}<div class="panel"><div class="kick">New tactic</div><h2>Add one card to your deck</h2><p>Tap a card to pick it.</p>
    <div class="cardrow">${opts.map((id,i)=>cardHTML(id,i,false).replace('class="card','class="card'+(sel===i?' sel':''))).join('')}</div>
    <button class="btn green" id="take" ${sel<0?'disabled':''}>Add to deck</button><button class="btn light" id="skip">Skip</button></div></div>`;
    stage().querySelectorAll('.cardrow .card').forEach(el=>el.onclick=()=>{sel=+el.dataset.i;draw();});
    $('#take').onclick=()=>{R.deck.push(opts[sel]);after();};$('#skip').onclick=after;};
  const after=()=>mapScreen();draw();}
function shop(){setMusic('th:shady');const items=shuffle(REWARD_POOL).slice(0,3).map(id=>({id,p:price(25+Math.floor(Math.random()*3)*5),sold:false}));const arts=Object.keys(ARTIFACTS).filter(a=>!has(a)&&!ARTIFACTS[a].bad);const AP=price(45),SP=price(30);const art=rnd(arts);let removed=false,artSold=false;
  const draw=()=>{updStats();stage().innerHTML=`<div class="screen">${route()}<div class="panel"><div class="kick">The back room · 💶 €${R.budget}k</div><h2>Spend your lobby budget</h2>
    <div class="cardrow">${items.map((it,i)=>`<div class="shopitem">${it.sold?'<div class="card" style="--tc:#9c8f84;opacity:.4"><div class="nm">Sold</div></div>':cardHTML(it.id,i,false)}<span class="price">${it.sold?'':'€'+it.p+'k'}</span></div>`).join('')}</div>
    ${art?`<div class="art"><span class="ae">${ARTIFACTS[art].e}</span><span><b>${ARTIFACTS[art].n}</b><small>${ARTIFACTS[art].tx}</small></span><button id="bart" ${artSold||R.budget<AP?'disabled':''}>${artSold?'Bought':'€'+AP+'k'}</button></div>`:''}
    <div class="art"><span class="ae">🗑️</span><span><b>Shred a card</b><small>Remove one card from your deck for good.</small></span><button id="brem" ${removed||R.budget<SP?'disabled':''}>${removed?'Done':'€'+SP+'k'}</button></div>
    <button class="btn green" id="leave">Back to work</button></div></div>`;
    stage().querySelectorAll('.shopitem .card[data-id]').forEach(el=>el.onclick=()=>{const it=items[+el.dataset.i];if(it.sold||R.budget<it.p)return toast('Not enough budget');R.budget-=it.p;it.sold=true;R.deck.push(it.id);draw();});
    if($('#bart'))$('#bart').onclick=()=>{R.budget-=AP;gainArt(art);artSold=true;draw();};
    $('#brem').onclick=()=>shred(()=>{R.budget-=SP;removed=true;draw();},draw);
    $('#leave').onclick=mapScreen;};
  draw();}
function shred(done,back){const ids=[...new Set(R.deck)];
  $('#ovl').innerHTML=`<div class="veil"><div class="panel" style="max-height:80vh;overflow:auto"><div class="kick">Shred a card</div><h2>Which card goes?</h2>
   <div class="cardrow">${ids.map((id,i)=>cardHTML(id,i,false)).join('')}</div><button class="btn light" id="sx">Back</button></div></div>`;
  $('#ovl').querySelectorAll('.card').forEach(el=>el.onclick=()=>{R.deck.splice(R.deck.indexOf(el.dataset.id),1);$('#ovl').innerHTML='';done();});$('#sx').onclick=()=>{$('#ovl').innerHTML='';back();};}
function endRun(){recordRun('W');R.ended=true;const n=R.log.filter(l=>l.c.eu===l.side).length;
  stage().innerHTML=`<div class="screen"><div class="panel"><div class="kick">Term complete</div><h2>You survived Brussels!</h2>
   <p>${R.log.length} dossiers, and Europe is still standing. You were on the same side as the real EU ${n} of ${R.log.length} times.</p>
   <p>Your deck: ${R.deck.length} cards${R.arts.length?' · '+R.arts.map(a=>ARTIFACTS[a].e+' '+ARTIFACTS[a].n).join(', '):''}.</p>
   <button class="btn green" id="again">New term</button></div></div>`;$('#again').onclick=title;}
function gameOver(why){SFX.lose();setMusic(null);recordRun('L');R.ended=true;F&&(F.over=true);
  stage().innerHTML=`<div class="screen"><div class="panel" style="border-top:6px solid var(--reject)"><div class="kick">End of your term · after ${R.fights} dossiers</div>
   <h2>${why==='vote'?'The final vote failed.':'Your reputation hit zero.'}</h2>
   <p>${why==='vote'?'Parliament voted your way down. You leave Brussels through the back door.':'Parliament files a motion of censure. You are out. Gerard already saved you a seat.'}</p>
   <p>Lost tugs of war and dirty cards cost reputation. A break with Gerard wins some back.</p><button class="btn red" id="again">Try again</button></div></div>`;$('#again').onclick=title;}

/* Gerard's one tip */
// Character scene: big portrait in a navy spotlight with the name on top, a paper strip with the text below.
function scene(key,fallback,kick,body,cls){const ch=(typeof CHARS!=='undefined'&&CHARS[key])||{};
  const [nm,...sub]=(ch.name||fallback).split(',');
  return `<div class="scene ${cls||''}"><div class="sc-port"><h3>${esc(nm)}</h3>${sub.length?`<small class="sc-sub">${esc(sub.join(',').trim())}</small>`:''}<div class="sc-fig">${ch.svg||''}</div></div><div class="sc-text"><span class="gl">· ${kick}</span>${body}</div></div>`;}
function gerard(html,then){const g=(typeof CHARS!=='undefined'&&CHARS.ghost&&CHARS.ghost.svg)||'';
  $('#ovl').innerHTML=`<div class="veil">${scene('ghost','Gerard Loby',then?'A ghost appears':'A tip',`<p>${html}</p><button class="btn" id="gok">${then?'Nice to meet you, Gerard':'Got it'}</button>`,'small')}</div>`;
  $('#gok').onclick=()=>{$('#ovl').innerHTML='';if(then)then();};$('#gok').focus();}

title();
</script>
