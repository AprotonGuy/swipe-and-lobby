<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Swipe & Lobby: a satirical game about real EU lobby dossiers. Approve or reject, keep the bars in balance, and find the secret endings.">
<meta name="theme-color" content="#2a1f27">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Swipe &amp; Lobby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=UnifrakturMaguntia&family=Playfair+Display:wght@900&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one phone-height column — stat ledger on top, a dossier card in the middle, swipe hints below. Committed single dark theme (night session in the Berlaymont). */
:root{
  /* palette: retro plum / teal / brick (user supplied) */
  --night:#392b35;        /* page ground, plum */
  --night-2:#423952;      /* raised panels, violet */
  --rule:#5a4e6a;
  --slate:#444760;
  --wine:#713f52;
  --paper:#d1bfb0;        /* card stock */
  --paper-2:#e2d4c6;      /* lighter paper for slips and bubbles */
  --paper-ink:#392b35;
  --text:#eadfd4;         /* text on the dark ground */
  --muted:#a9b9b4;
  --star:#7a9c96;         /* accent: sea-glass teal */
  --approve:#486b7f;      /* stamp ink blue */
  --reject:#bb474f;       /* stamp ink brick red */
  --up:#7a9c96; --down:#d0636a;
  --grain:none; /* replaced at load by a pre-rendered noise tile (cheap on phones) */
  --f-display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --f-type:"Courier Prime", "Courier New", ui-monospace, monospace;
  --f-easy:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%}
html{overflow-x:hidden;overflow-x:clip}body{max-width:100vw}
[hidden]{display:none!important}
body{background:var(--night);color:var(--text);font-family:var(--f-body);margin:0;overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;padding-inline:16px;box-sizing:border-box}

/* stat ledger */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding-block:14px 10px}
.stat{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.stat .ico{font-size:22px;line-height:1;transition:transform .2s}
.bar{width:100%;height:8px;border-radius:4px;background:var(--night-2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--rule)}
.bar i{display:block;height:100%;background:var(--paper);border-radius:4px;transition:width .5s cubic-bezier(.2,.8,.2,1),background .3s}
.stat.low .bar i,.stat.high .bar i{background:var(--reject)}
.stat.danger .bar{animation:dangerblink 1s ease-in-out infinite}
@keyframes dangerblink{50%{box-shadow:0 0 0 2px var(--reject),0 0 12px var(--reject)}}
#gerard{position:fixed;left:50%;transform:translateX(-50%);z-index:60;width:min(420px,calc(100% - 24px));display:flex;gap:10px;align-items:flex-start;background:linear-gradient(180deg,rgba(233,238,240,.97),rgba(214,224,228,.97));color:#26303a;border-radius:14px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 24px rgba(200,225,235,.35);animation:rise .3s ease-out}
#gshade{position:fixed;inset:0;z-index:59;background:rgba(12,16,22,.38);touch-action:none}
body:has(#warn:not([hidden])) #gshade{background:rgba(12,6,8,.62)}
#gerard.nudge{animation:gnudge .35s}
@keyframes gnudge{0%,100%{translate:0}25%{translate:-6px}75%{translate:6px}}
#gerard.bottom{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.gerard.mid{top:50%;transform:translate(-50%,-50%)}
#gerard.mid{top:40%}
#gerard.top{top:calc(146px + env(safe-area-inset-top,0px))}
#gerard svg{width:52px;height:52px;flex:none;border-radius:50%;background:rgba(122,156,150,.25);animation:gfloat 3s ease-in-out infinite}
@keyframes gfloat{50%{transform:translateY(-4px)}}
#gerard.intro{animation:materialize 1.4s ease-out}
@keyframes materialize{0%{opacity:0;filter:blur(8px);transform:translateX(-50%) translateY(10px) scale(.92)}60%{opacity:.6;filter:blur(2px)}100%{opacity:1;filter:none;transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){#gerard.intro{animation:none}}
#gerard b{display:block;font:700 10px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#486b7f;margin-bottom:3px}
#gerard p{margin:0;font:500 14px/1.4 var(--f-body)}
#gerard .gbtn{display:flex;gap:8px;margin-top:8px;align-items:center}
#gerard button{appearance:none;border:0;background:#26303a;color:#e9eef0;border-radius:6px;padding:7px 12px;font:600 12.5px/1 var(--f-body);cursor:pointer}
#gerard button.ghostly{background:none;color:#486b7f;text-decoration:underline;padding:7px 4px}
#warn{box-sizing:border-box;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:61;width:min(400px,calc(100% - 32px));display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;background:var(--grain),var(--paper-2);color:var(--paper-ink);border-radius:14px;padding:18px 18px 16px;box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 0 3px var(--reject),0 0 40px rgba(214,69,65,.45);animation:warnIn .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes warnIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
#warn.nudge{animation:gnudge .35s}
#warn svg,#warn img{width:96px;height:96px;flex:none;border-radius:50%;box-shadow:0 0 0 3px var(--reject)}
#warn .wk{font:700 11px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--reject)}
#warn h3{margin:0;font:800 22px/1.15 var(--f-body);color:var(--paper-ink)}
#warn .wv{font:700 13px/1 var(--f-mono);color:#fff;background:var(--reject);border-radius:999px;padding:5px 10px}
#warn .wq{font:italic 500 16px/1.4 var(--f-body);margin:2px 0 4px}
#warn .wn{font:600 11px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;opacity:.7}
#warn button{appearance:none;border:0;background:var(--reject);color:#fff;border-radius:8px;padding:11px 26px;font:700 15px/1 var(--f-body);cursor:pointer;margin-top:4px}
#warn button:focus-visible{outline:3px solid var(--paper-ink);outline-offset:2px}
.stat .lbl{font:500 10px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.stat .pct{font:500 11px/1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--text)}
.stat .hint{position:absolute;top:-4px;right:calc(50% - 22px);width:0;height:0;border-radius:50%;transition:all .15s}
.stat.up .ico{transform:translateY(-2px)}
.stat.down .ico{transform:translateY(2px)}
.stat.up .hint{background:var(--up);box-shadow:0 0 10px var(--up)}
.stat.down .hint{background:var(--down);box-shadow:0 0 10px var(--down)}
.stat.s .hint{width:6px;height:6px}.stat.m .hint{width:9px;height:9px}.stat.l .hint{width:12px;height:12px}

.meta{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--rule);padding-top:8px;font:500 11px/1.2 var(--f-mono);color:var(--muted);letter-spacing:.04em}
.meta b{color:var(--star);font-weight:500}

/* card stage */
.stage{flex:1;position:relative;display:grid;place-items:center;perspective:900px;min-height:0;overflow-x:clip}
.card{position:absolute;width:min(330px,100%);max-height:100%;min-height:min(440px,100%);background:var(--grain),radial-gradient(120% 90% at 30% 15%,rgba(255,250,240,.45),transparent 60%),linear-gradient(170deg,#d8c7b8,var(--paper) 55%,#c4b09f);
  color:var(--paper-ink);border-radius:4px 4px 3px 5px;
  box-shadow:0 1px 1px rgba(30,20,26,.35),0 6px 10px rgba(30,20,26,.25),0 22px 40px rgba(20,12,18,.45),inset 0 0 0 1px rgba(255,248,240,.35),inset 0 0 24px rgba(113,63,82,.12);display:flex;flex-direction:column;overflow:hidden;
  touch-action:none;cursor:grab;will-change:transform;contain:layout paint;-webkit-user-select:none}
.card.back{transform:translate(6px,10px) rotate(2.4deg) scale(.96);cursor:default;will-change:auto}
.card.back>*:not(.stamp){opacity:.55}
.card.back .stamp{display:none}
.card.back2{transform:translate(-8px,14px) rotate(-3deg) scale(.94);background:#a9988b}
.card::before{content:"";position:absolute;inset:7px;border:1px solid rgba(57,43,53,.28);outline:1px solid rgba(57,43,53,.12);outline-offset:3px;border-radius:2px;pointer-events:none}
.card::after{content:"";position:absolute;right:0;bottom:0;width:26px;height:26px;pointer-events:none;
  background:linear-gradient(135deg,var(--paper-2) 0 48%,rgba(57,43,53,.25) 50%,var(--night) 52%);box-shadow:-2px -2px 4px rgba(30,20,26,.15)}
.fold{position:absolute;left:0;right:0;top:46%;height:1px;background:linear-gradient(90deg,transparent,rgba(57,43,53,.12) 15%,rgba(255,248,240,.5) 50%,rgba(57,43,53,.12) 85%,transparent);pointer-events:none}
.card.dragging{cursor:grabbing}
.card.anim{transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .45s}
.card .head{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 14px 0}
.dossier{font:500 10px/1.35 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--slate)}
.dossier strong{display:block;color:var(--paper-ink);font-size:11px}
.badge{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;text-align:center;background:var(--sc)!important;color:#141014;
  border:2.5px solid var(--sc);box-shadow:inset 0 0 0 2px rgba(255,255,255,.85),0 2px 6px rgba(0,0,0,.25);transform:rotate(-9deg);
  font:800 8.5px/1 var(--f-display);letter-spacing:.04em;text-shadow:none}
.badge span{display:block;font-size:24px;line-height:1;margin-bottom:2px;filter:grayscale(1) brightness(0)}
.badge.inv{color:#fff}.badge.inv span{filter:grayscale(1) brightness(0) invert(1)}

.portrait{display:grid;place-items:center;padding:4px 0 2px}
.portrait svg{width:min(118px,32vw);height:auto}
.who{text-align:center;padding:0 16px}
.who .name{font:600 14px/1.2 var(--f-body)}
.who .role{font:400 12px/1.3 var(--f-body);color:var(--slate)}
.body{padding:12px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.body h2{margin:0;font:800 24px/1.05 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.body p{margin:0;font:400 17px/1.42 var(--f-body);overflow:auto}
.body{position:relative}
#top .body{padding-bottom:26px}
#top .body{cursor:zoom-in}
.body .zoom{position:absolute;right:44px;bottom:6px;font:600 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--slate);background:var(--paper);padding:4px 6px;border-radius:3px;border:1px solid rgba(57,43,53,.25);pointer-events:none}
.card:not(#top) .body .zoom{display:none}
.letter.readpop .modal{border-top:6px solid var(--sec,var(--reject))}
.letter.nego .modal{border-top:6px solid #b08a2e}
.nego .deals{display:grid;gap:8px;margin:12px 0 4px}
.nego .deal{appearance:none;text-align:left;border:1.5px solid var(--paper-ink);background:rgba(255,255,255,.18);color:var(--paper-ink);border-radius:8px;padding:11px 12px;cursor:pointer;display:grid;gap:4px;font:inherit}
.nego .deal:hover{background:rgba(255,255,255,.35)}
.nego .deal b{font:700 15px/1.25 var(--f-body)}
.nego .deal span.dd{font:400 13px/1.4 var(--f-body);color:var(--slate)}
.nego .deal .deltas{margin:2px 0 0}
.nego .deal:disabled{opacity:.35;cursor:default}
.nego .deal .gh{font:600 11px/1 var(--f-mono);color:#3d6b65}
.nego .deal.cursed{background:#5a1820;border-color:#2a0a0e;color:#f4d9d0}
.nego .deal.cursed b{font:italic 700 17px/1.2 var(--f-display);color:#f2c94c}
.nego .deal.cursed span.dd{color:#d9a9a0;text-decoration:line-through;text-decoration-color:rgba(242,201,76,.6);font-size:11px}
.letter.nego.cursed .modal{border-top-color:#7a1f2b;background:var(--grain),linear-gradient(180deg,#d6b9ad,#c8a89b)}
.nego .verdictbox{border-radius:8px;padding:12px;margin:10px 0;font:500 14px/1.45 var(--f-body)}
.nego .verdictbox.yes{background:rgba(61,107,101,.18);border:1.5px solid #3d6b65}
.nego .verdictbox.info{background:rgba(72,107,127,.12);border:1.5px solid #486b7f}
.nego .ghostbtn{appearance:none;border:1.5px dashed var(--paper-ink);background:none;color:var(--paper-ink);border-radius:6px;padding:7px 10px;font:600 12.5px/1 var(--f-body);cursor:pointer}
.readpop .rp-who{display:flex;gap:12px;align-items:center;margin:10px 0 4px}
.readpop .rp-who svg,.readpop .rp-who img.art{width:56px;height:56px;flex:none;border-radius:50%}
.readpop .rp-name{font:700 15px/1.2 var(--f-display)}
.readpop .rp-role{font:400 13px/1.3 var(--f-body);color:var(--slate)}
.readpop h3{font-size:26px!important;margin-top:8px}
.readpop .rp-ask{font:400 20px/1.55 var(--f-body);margin:12px 0 16px;user-select:text}
.readpop .rp-quip{font:italic 400 16px/1.45 var(--f-body);color:var(--slate);border-left:3px solid var(--sec,var(--slate));padding-left:10px;margin:8px 0 0}
.stamp{position:absolute;top:36%;padding:6px 12px;border:4px solid currentColor;border-radius:6px;font:800 24px/1 var(--f-display);
  letter-spacing:.08em;text-transform:uppercase;opacity:0;pointer-events:none;background:rgba(255,255,255,.08)}
.stamp.ok{left:14px;color:var(--approve);transform:rotate(-14deg)}
.stamp.no{right:14px;color:var(--reject);transform:rotate(12deg)}
.stamp.mid{left:50%;top:22%;color:#b08a2e;transform:translateX(-50%) rotate(-4deg);white-space:nowrap}

.app{position:relative}
.rcwrap{position:relative;padding-top:10px}
.rctab{width:100%;appearance:none;border:1px dashed var(--rule);background:transparent;color:var(--text);border-radius:10px;padding:10px 12px;
  font:500 13px/1.2 var(--f-body);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.rctab .k{font:500 10px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--star)}
.rctab[aria-expanded="true"]{border-style:solid;border-color:var(--star)}
.rctab:focus-visible{outline:2px solid var(--star);outline-offset:2px}
.grab{width:42px;height:5px;border-radius:3px;background:rgba(57,43,53,.3);margin:-6px auto 10px;cursor:grab;touch-action:none}
.sheet{overscroll-behavior:contain;position:absolute;left:0;right:0;bottom:calc(100% - 6px);z-index:5;max-height:min(48dvh,480px);overflow:auto;background:var(--grain),var(--paper);color:var(--paper-ink);
  border-radius:4px;padding:16px 16px 12px;box-sizing:border-box;box-shadow:0 -12px 40px rgba(0,0,0,.5);
  animation:rise .3s cubic-bezier(.2,.8,.2,1);user-select:text;-webkit-user-select:text}
.sheet .kicker{font:500 10px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--slate)}
.sheet h3{margin:6px 0 2px;font:800 20px/1.1 var(--f-display);text-wrap:balance}
.spoil{font:400 12.5px/1.4 var(--f-body);color:var(--slate);margin:2px 0 8px}
.sheet .spoil{font:400 12px/1.4 var(--f-body);color:var(--slate);margin:2px 0 8px}
.toast{position:absolute;left:16px;right:16px;bottom:170px;z-index:6;background:var(--grain),var(--paper-2);color:var(--paper-ink);border-radius:12px;padding:10px 12px;
  box-shadow:0 10px 30px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:6px;animation:drop 2.6s ease forwards;pointer-events:none}
.toast .verdict{margin:0}
@keyframes drop{0%{opacity:0;transform:translateY(-10px)}10%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-block:10px 14px}
.choices .m{display:none}
body.hasM .choices{grid-template-columns:1fr auto 1fr}
body.hasM .choices .m{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-color:#b08a2e;padding-inline:12px}
.choices .m small{font:500 9.5px/1 var(--f-mono);letter-spacing:.04em;color:var(--muted)}
.choices .m:disabled{opacity:.4}
.card.promisedM .stamp.ok,.card.promisedM .stamp.no,.card.promisedR .stamp.mid,.card.promisedL .stamp.mid{display:none}
.shop .extra{border-top:1px dotted rgba(57,43,53,.35);margin-top:8px;padding-top:8px}
.choices button{appearance:none;border:1px solid var(--rule);background:var(--night-2);color:var(--text);border-radius:10px;padding:11px 8px;
  font:600 13px/1.2 var(--f-body);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.choices button:focus-visible,.modal button:focus-visible{outline:2px solid var(--star);outline-offset:2px}
.choices .l{border-color:color-mix(in srgb,var(--reject) 55%,var(--rule))}
.choices .r{border-color:color-mix(in srgb,var(--approve) 65%,var(--rule))}
.foot{font:500 10px/1.4 var(--f-mono);color:var(--muted);text-align:center;padding-bottom:10px;letter-spacing:.03em}
.foot a{color:var(--muted)}

/* overlays */
.veil{position:fixed;inset:0;background:rgba(28,20,26,.82);display:grid;place-items:end center;z-index:10;padding:16px;
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.modal{width:min(460px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--grain),var(--paper);color:var(--paper-ink);border-radius:4px;
  padding:20px 18px 18px;box-sizing:border-box;animation:rise .35s cubic-bezier(.2,.8,.2,1);user-select:text;-webkit-user-select:text}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
.modal .kicker{font:500 10px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--slate)}
.modal h3{margin:6px 0 4px;font:800 22px/1.1 var(--f-display);text-wrap:balance}
.verdict{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.chip{font:600 11px/1 var(--f-body);padding:6px 9px;border-radius:999px;border:1.5px solid currentColor}
.chip.ok{color:var(--approve)}.chip.no{color:var(--reject)}.chip.mix{color:var(--wine)}
.chip.match{background:var(--paper-ink);color:var(--paper);border-color:var(--paper-ink)}
.block{padding:10px 0;border-top:1px solid rgba(57,43,53,.22)}
.society{background:rgba(122,156,150,.18);border-top:0;border-left:3px solid var(--star);padding:10px 12px;margin:6px 0;border-radius:2px}
.news .modal{background:var(--grain),linear-gradient(180deg,#e9e0d3,#ddd1c2);color:#231a20;border-radius:1px;padding:14px 14px 12px;
  transform:none;box-shadow:0 2px 2px rgba(0,0,0,.25),0 24px 50px rgba(0,0,0,.5);--np-serif:"Libre Caslon Text",Georgia,"Times New Roman",serif;--np-head:"Playfair Display",Georgia,serif}
.news .np-top{display:flex;justify-content:space-between;gap:8px;font:400 9px/1.2 var(--np-serif);font-style:italic}
.news .np-name{font:400 clamp(30px,9.5vw,42px)/1.05 "UnifrakturMaguntia","Old English Text MT",serif;text-align:center;margin:2px 0 4px}
.news .np-bar{display:flex;justify-content:space-between;gap:6px;border-top:3px double #231a20;border-bottom:1px solid #231a20;padding:4px 0 3px;
  font:700 9px/1.2 var(--np-serif);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.news .np-kick{font:700 10px/1 var(--np-serif);letter-spacing:.16em;text-transform:uppercase;color:var(--reject);text-align:center}
.news .np-head{font:900 clamp(25px,7.6vw,33px)/1.02 var(--np-head);text-align:center;margin:6px 0 6px;text-wrap:balance;letter-spacing:-.01em}
.news .np-sub{font:italic 400 13px/1.35 var(--np-serif);text-align:center;border-bottom:1px solid rgba(35,26,32,.45);padding-bottom:9px;margin-bottom:10px;text-wrap:balance}
.np-body{display:grid;grid-template-columns:42% 1fr;gap:12px;align-items:start}
.np-body>*{min-width:0}
.np-photo{position:relative;filter:grayscale(1) contrast(1.2) brightness(1.05);background:#cbbfb2;border:1px solid #231a20;aspect-ratio:1;overflow:hidden}
.np-photo svg{width:100%;height:100%;display:block}

function applyText(O){
  const okfx=a=>Array.isArray(a)&&a.length===4&&a.every(v=>typeof v==='number'&&isFinite(v));
  {const o=O['practice:card'];if(o){if(o.title)PRACTICE.title=o.title;if(o.quip)PRACTICE.quip=o.quip;if(o.ask)PRACTICE.ask=o.ask;}}

const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function typeIn(root,onDone){
  let doneCalled=false;const done=()=>{if(!doneCalled&&onDone){doneCalled=true;onDone();}};
  const els=[...root.querySelectorAll('[data-type]')];
  const full=els.map(e=>e.textContent);els.forEach(e=>{e.textContent='\u00a0'});
  let i=0,j=0,stop=false,timer;
  const finish=()=>{stop=true;clearTimeout(timer);els.forEach((e,k)=>{e.textContent=full[k];e.classList.remove('typing')});done();};
  if(RM||!els.length){finish();return finish}
  const tick=()=>{if(stop)return; if(i>=els.length){done();return;}
    const e=els[i];j++;e.classList.add('typing');e.textContent=full[i].slice(0,j);if(full[i][j-1]!==' ')SND.type();
    if(j>=full[i].length){e.classList.remove('typing');i++;j=0;timer=setTimeout(tick,260);return}
    const ch=full[i][j-1];timer=setTimeout(tick,/[.,!?:;]/.test(ch)?140:22+Math.random()*24);};
  timer=setTimeout(tick,200);
  root.addEventListener('pointerdown',finish,{once:true});
  return finish;
}

  const move=(y,e)=>{if(y0===null)return;dy=y-y0;

    box:`<div class="np-box"><b>👻 Secret ending</b>You helped with all four requests.</div>`,foot:'Weather: a cold draught on the 13th floor.',footR:'Turn the page →'});
  layer.querySelector('.veil').classList.add('fired');
  const b=$('#cont');b.textContent='What happened to me? →';b.focus({preventScroll:true});
  b.onclick=()=>{SND.ghost&&SND.ghost(true);
    layer.innerHTML=`<div class="veil over"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="ov-h">
      <div class="kicker">Secret ending · day ${day}</div><div class="big">👻</div><h3 id="ov-h">${N('You are the ghost now, {name}.')}</h3>
      <p>${G(E.end)}</p>${termReview(false,'possessed',{next:'You haunt the filing cabinet on the 13th floor. Sometimes, in meetings, you hear your own voice calling people “old chap”.'})}
      <button class="next" id="restart" type="button">Haunt the next Commissioner</button></div></div>`;
    $('#restart').onclick=()=>{ghostRename();start();};$('#restart').focus({preventScroll:true});};
}
function win(){
  metaEnd(true);inGame=false;clearSave();SND.win();$('#warn').hidden=true;$('#gerard').hidden=true;tipQ.length=0;tipBusy=false;
  const st=futStatus();
  layer.innerHTML=`<div class="veil over win"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="ov-h">
   <div class="kicker">Term completed · day ${day}</div><div class="big">★</div><h3 id="ov-h">Time to move on, ${N('{name}')}.</h3>
   <p>Your term is over. All ${deck.length} dossiers handled, and the Union is still standing. Brussels will miss you. The lobbyists already do.</p>
   <p class="stats-sum">${STATS.map(x=>`${x.ico} ${S[x.k]}%`).join(' · ')}</p>
   ${PX.dream?(()=>{const d=DREAMS[PX.dream],p=dreamProg();return `<p class="dr-end ${p.ok?'ok':'no'}">${d.ico} Your dream, <b>${d.name}</b>: ${p.ok?'★ achieved!':'it slipped away'} <small>(${p.txt})</small></p>`;})():''}
   <h4 class="fut-h">Choose your future</h4>
   <div class="futs">${FUTURES.map(f=>{const s=st[f.id];return `<button type="button" class="fut${s.ok?'':' locked'}${PX.dream===f.id?' mine':''}" data-fut="${f.id}" ${s.ok?'':'disabled'}>
     <span class="fi">${s.ok?f.ico:'🔒'}</span><span class="ft"><b>${s.ok||secrets().includes(f.id)?f.name:'??? A secret you never heard'}${PX.dream===f.id?' <em class="mine-tag">★ your dream</em>':''}</b><small>${s.ok?'Unlocked':'Needs: '+f.need}</small><small class="fp">${s.prog}</small></span></button>`}).join('')}</div>
   </div></div>`;
  layer.querySelectorAll('.fut:not(.locked)').forEach(b=>b.onclick=()=>future(FUTURES.find(f=>f.id===b.dataset.fut)));
  const first=layer.querySelector('.fut:not(.locked)');first&&first.focus({preventScroll:true});
}
function future(F){
  const dreamTrue=PX.dream===F.id&&dreamProg().ok;
  layer.innerHTML=paper({edition:'Farewell edition',kick:dreamTrue?'★ Dream come true':F.kick,head:futText(F.head),sub:futText(F.sub),
    photo:`<svg viewBox="0 0 120 120"><rect width="120" height="120" fill="#bdb0a2"/><text x="60" y="72" font-size="24" text-anchor="middle" textLength="108" lengthAdjust="spacingAndGlyphs">${F.scene}</text></svg>`,
    cap:N('Former Commissioner {name}, this week.'),body:`<p>${futText(F.text)}</p>${dreamTrue?`<p><b>${N('“This is what I wanted all along,” says {name}.')}</b> ${PX.dream==='job'?'And the lobby made sure it’s the biggest office on the floor.':'Five years of Brussels, and it was worth it.'}</p>`:''}`,
    box:`<div class="np-box"><b>${F.ico} ${F.name}</b>Unlocked by: ${F.need.toLowerCase()}.</div>`,
    foot:`★ Term completed · day ${day}`,footR:'Turn the page →'});
  const b=$('#cont');b.textContent='Read your term review →';b.focus({preventScroll:true});
  b.onclick=()=>{SND.paper&&SND.paper();
    layer.innerHTML=`<div class="veil over win"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="ov-h">
      <div class="kicker">Term completed · day ${day} · ${F.ico} ${F.name}</div><h3 id="ov-h">${futText(F.head)}</h3>
      ${termReview(true,'won',F)}
      <button class="next" id="restart" type="button">New term</button></div></div>`;
    $('#restart').onclick=start;$('#restart').focus({preventScroll:true});};
}

$('#btnL').onclick=()=>!layer.innerHTML&&decide('L');
$('#btnR').onclick=()=>!layer.innerHTML&&decide('R');
$('#btnM').onclick=()=>!layer.innerHTML&&decide('M');
document.addEventListener('keydown',e=>{
  if(secOpen()){if(e.key==='Escape'){e.preventDefault();closeSecrets();}return}
  if(tipModal()){if(e.key==='Enter'||e.key===' '||e.key==='Escape'){const b=warnOpen()?$('#w-ok'):$('#g-ok');if(b&&document.activeElement!==b){e.preventDefault();b.click()}}else e.preventDefault();return}
  if(ovl.innerHTML)return;
  if(layer.innerHTML){if(e.key==='Enter'||e.key===' '){const b=$('#restart')||$('#go')||$('#cont');if(b&&document.activeElement!==b){e.preventDefault();b.click()}}return}
  if(e.key==='Escape')setSheet(false);
  if(e.key==='ArrowLeft')decide('L'); if(e.key==='ArrowRight')decide('R'); if(e.key==='ArrowUp'&&canM())decide('M');
});
start();
// Live text edits: the Regiekamer page of this game saves into the game's own store; read them on load.
(async()=>{try{if(!window.claude||!claude.use)return;const db=await claude.use('db');if(!db)return;
  const snap=await db.collection('overrides').get();const O={};snap.docs.forEach(d=>{O[d.id]=d.data();});
  if(Object.keys(O).length){applyText(O);ghostRename();}
  const user=await claude.use('user');const own=user?await user.canEdit().catch(()=>false):false;
  if(own){window.CAN_EDIT=true;const t=document.querySelector('.title .credit');if(t&&!document.getElementById('t-edit'))t.insertAdjacentHTML('beforebegin','<span class="t-edits"><a id="t-edit" class="t-edit" href="regiekamer.html">✎ Regiekamer (texts)</a> · <a class="t-edit" href="https://claude.ai/artifact/U9ZbpujtoFfqwjNU848f22" target="_blank" rel="noopener">🎨 Art Studio</a><br><small>only you see this</small></span>');}
}catch(e){}})();
</script>
